name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: google-gemini/ai-pr-reviewer@main # 구글 공식/검증된 실제 액션 주소로 변경
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          # 사용하는 액션에 맞는 옵션 설정 (기본값으로 동작)
          model: "gemini-2.5-flash"
